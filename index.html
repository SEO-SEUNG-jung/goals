<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>목표·루틴</title>
<meta name="theme-color" content="#1f3864">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<style>
:root{
  --bg:#f4f6f9; --panel:#ffffff; --panel-2:#f8fafc; --text:#1c2434; --muted:#667085; --line:#e3e8ef; --line-2:#d0d7e2;
  --accent:#1f3864; --accent-2:#2f5ca8; --accent-soft:#e8eef8; --pos:#1a7f37; --neg:#c62828; --warn-bg:#fff4e0; --warn-line:#f0c36d;
  --c1:#1f3864; --c2:#4f8fd6; --c3:#e8833a; --c4:#5fa84f; --heat:47,92,168;
  --radius:10px; --shadow:0 1px 2px rgba(16,24,40,.06),0 1px 3px rgba(16,24,40,.08);
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#11151c; --panel:#191f29; --panel-2:#1f2633; --text:#e6e9ef; --muted:#97a1b3; --line:#2a3242; --line-2:#364056;
  --accent:#9db8ff; --accent-2:#7ea2f5; --accent-soft:#232e45; --pos:#5cc779; --neg:#ff6b6b; --warn-bg:#2d2616; --warn-line:#7a6125;
  --c1:#7ea2f5; --c2:#4fc3e8; --c3:#f0a35e; --c4:#7bcf6a; --heat:126,162,245; --shadow:none;
}}
:root[data-theme="dark"]{
  --bg:#11151c; --panel:#191f29; --panel-2:#1f2633; --text:#e6e9ef; --muted:#97a1b3; --line:#2a3242; --line-2:#364056;
  --accent:#9db8ff; --accent-2:#7ea2f5; --accent-soft:#232e45; --pos:#5cc779; --neg:#ff6b6b; --warn-bg:#2d2616; --warn-line:#7a6125;
  --c1:#7ea2f5; --c2:#4fc3e8; --c3:#f0a35e; --c4:#7bcf6a; --heat:126,162,245; --shadow:none;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--text);font:14px/1.5 "Malgun Gothic","맑은 고딕","Apple SD Gothic Neo",system-ui,sans-serif;-webkit-font-smoothing:antialiased}
button,input,select{font:inherit;color:inherit}
.top{position:sticky;top:0;z-index:20;background:var(--panel);border-bottom:1px solid var(--line)}
.bar{display:flex;align-items:center;gap:12px;padding:10px 16px;min-height:56px}
.brand{font-size:18px;font-weight:700;color:var(--accent);letter-spacing:-.3px}
.spacer{flex:1}
.layout{display:flex;align-items:flex-start}
nav#tabs{flex:none;width:168px;position:sticky;top:57px;height:calc(100vh - 57px);overflow-y:auto;display:flex;flex-direction:column;gap:2px;padding:14px 10px;background:var(--panel);border-right:1px solid var(--line)}
nav#tabs button{border:0;background:none;padding:9px 12px;border-radius:8px;border-left:3px solid transparent;color:var(--muted);cursor:pointer;white-space:nowrap;font-weight:600;text-align:left}
nav#tabs button.on{color:var(--accent);background:var(--accent-soft);border-left-color:var(--accent)}
nav#tabs button:hover{color:var(--text);background:var(--panel-2)}
nav#tabs button.on:hover{background:var(--accent-soft)}
.content{flex:1;min-width:0}
main{max-width:none;padding:16px 16px 60px}
select,input{background:var(--panel);border:1px solid var(--line-2);border-radius:7px;padding:6px 8px;min-width:0}
input:focus,select:focus{outline:2px solid var(--accent-2);outline-offset:-1px;border-color:transparent}
button{border:1px solid var(--line-2);background:var(--panel);border-radius:7px;padding:6px 12px;cursor:pointer}
button:hover{background:var(--panel-2)}
button.primary{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
:root[data-theme="dark"] button.primary{color:#0f1420}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]) button.primary{color:#0f1420} }
button.danger{color:var(--neg);border-color:var(--neg);background:transparent}
button.sm{padding:2px 8px;font-size:12px}
button.link{border:0;background:none;color:var(--accent-2);padding:2px 4px}
.pill{font-size:12px;padding:4px 10px;border-radius:999px;border:1px solid var(--line-2);color:var(--muted);white-space:nowrap;cursor:default}
.pill.ok{color:var(--pos);border-color:var(--pos)}
.pill.warn{color:#b26a00;border-color:var(--warn-line);background:var(--warn-bg);cursor:pointer}
.pill.err{color:var(--neg);border-color:var(--neg)}
#banner .inner{max-width:none;margin:12px 0 0;padding:0 16px}
.notice{background:var(--warn-bg);border:1px solid var(--warn-line);border-radius:var(--radius);padding:12px 14px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.notice p{margin:0;flex:1;min-width:240px}
h2{font-size:15px;margin:0 0 10px;color:var(--accent)}
h2 small{color:var(--muted);font-weight:400;margin-left:6px;font-size:12px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:14px 16px;box-shadow:var(--shadow);margin-bottom:16px;min-width:0}
.row{display:grid;gap:16px;grid-template-columns:repeat(auto-fit,minmax(min(320px,100%),1fr))}
.row>.card{margin-bottom:0}
.stack{display:flex;flex-direction:column;gap:16px}
.stack>.card{margin-bottom:0}
.tel-row{grid-template-columns:repeat(auto-fit,minmax(min(230px,100%),1fr))}
.tel-row>.card{padding:12px clamp(8px,1vw,16px)}
table.grid.tel{table-layout:fixed;width:100%;font-size:clamp(11.5px,0.95vw,13.5px)}
table.grid.tel th,table.grid.tel td{white-space:normal;word-break:keep-all;overflow-wrap:anywhere;padding:4px clamp(3px,0.45vw,8px)}
table.grid.tel td:last-child{padding-left:2px;padding-right:0;text-align:right}
table.grid.tel button.sm{padding:1px 6px;font-size:11.5px}
.kpis{display:grid;gap:12px;grid-template-columns:repeat(4,minmax(0,1fr));margin-bottom:16px}
@media (max-width:900px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}}
#txTable.mobile{min-width:0;table-layout:auto}
#txTable.mobile tr td{white-space:normal;padding:8px 4px;cursor:pointer}
.mtx{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.mtx-l,.mtx-r{display:flex;flex-direction:column;gap:2px;min-width:0}
.mtx-l{text-align:left;align-items:flex-start}
.mtx-l b{font-size:14px;overflow:hidden;text-overflow:ellipsis}
.mtx-l span,.mtx-r span{font-size:12px;color:var(--muted)}
.mtx-r{text-align:right;flex:none}
.mtx-r b{font-size:15px}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:12px 16px;box-shadow:var(--shadow)}
.kpi .l{color:var(--muted);font-size:12px}
.kpi .v{font-size:clamp(17px,1.9vw,24px);font-weight:700;letter-spacing:-.5px;margin:2px 0;font-variant-numeric:tabular-nums}
.kpi .s{color:var(--muted);font-size:12px}
.neg{color:var(--neg)} .pos{color:var(--pos)} .muted{color:var(--muted)}
.progress{height:10px;background:var(--panel-2);border:1px solid var(--line);border-radius:999px;overflow:hidden;margin-top:6px}
.progress>i{display:block;height:100%;background:var(--accent-2)}
.progress>i.over{background:var(--neg)}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin-bottom:6px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px}
svg text{fill:var(--muted);font-size:11px}
.hb{display:grid;grid-template-columns:minmax(64px,128px) minmax(40px,1fr) auto;gap:4px clamp(6px,0.8vw,10px);align-items:center;font-size:clamp(11.5px,1vw,13px)}
.hb .bar-t{height:14px;background:var(--panel-2);border-radius:3px;overflow:hidden}
.hb .bar-t i{display:block;height:100%;background:var(--c2);border-radius:3px}
.hb .amt{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.hb .amt small{color:var(--muted);margin-left:6px;display:inline-block;min-width:42px}
.tablewrap{overflow:auto;max-width:100%}
table.grid{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums}
table.grid th,table.grid td{border-bottom:1px solid var(--line);padding:5px 8px;text-align:left;white-space:nowrap}
table.grid thead th{background:var(--accent);color:#fff;font-weight:600;position:sticky;top:0;z-index:1;text-align:center}
:root[data-theme="dark"] table.grid thead th{color:#0f1420}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]) table.grid thead th{color:#0f1420} }
table.grid td.num,table.grid th.num{text-align:right}
table.grid tr.sub td{background:var(--accent-soft);font-weight:700}
table.grid tr.tot td{background:var(--panel-2);font-weight:700;border-top:2px solid var(--line-2)}
table.grid tr.blk td{background:var(--panel-2);color:var(--accent);font-weight:700}
table.grid tr.hl td{background:var(--warn-bg)}
table.grid tbody tr:hover td{background:var(--panel-2)}
table.grid td.link{cursor:pointer}
table.grid td.link:hover{text-decoration:underline;color:var(--accent-2)}
table.grid td.over{color:var(--neg);font-weight:600}
table.grid td.und{background:var(--warn-bg);box-shadow:inset 0 0 0 1px var(--warn-line)}
.und-key{background:var(--warn-bg);border:1px solid var(--warn-line);border-radius:3px;padding:0 4px}
table.grid td.dim{color:var(--muted)}
table.grid td.wrap{white-space:normal;min-width:160px}
table.grid.compact th,table.grid.compact td{padding:4px 6px;font-size:12.5px}
table.grid.compact input.cell{width:78px!important;font-size:12.5px}
table.grid.fit{table-layout:fixed;width:100%;min-width:840px;font-size:clamp(9.5px,0.82vw,12.5px)}
table.grid.fit th,table.grid.fit td{font-size:inherit;padding:4px clamp(2px,0.35vw,6px)}
table.grid.fit td:first-child{white-space:normal;word-break:keep-all}
table.grid.fit.fixtbl{min-width:920px}
table.grid.fit.mid{min-width:600px}
table.grid.fit.nomin{min-width:0}
table.grid.fit.trend{min-width:960px}
table.grid.fit.trend input.cell{padding:2px 2px;letter-spacing:-.2px}
table.grid.fit.mid,table.grid.fit.nomin{font-size:clamp(11.5px,1vw,13.5px)}
table.grid.fit.wraptext td{white-space:normal;word-break:keep-all;overflow-wrap:anywhere}
table.grid.fit.wraptext td.num{white-space:nowrap}
table.grid.fit.wraptext tr:not(.blk) td:last-child{padding-left:2px;padding-right:0;text-align:right}
table.grid.fit button.sm{padding:1px 6px;font-size:11px}
table.grid.fixtbl td:nth-child(3){white-space:normal;word-break:keep-all}
table.grid.fixtbl tr:not(.blk) td:last-child{padding-left:2px;padding-right:0;text-align:right}
table.grid.fixtbl button.sm{padding:1px 6px;font-size:11px}
table.grid.fit input.cell{width:100%!important;font-size:inherit;padding:2px 3px}
.sticky-first th:first-child,.sticky-first td:first-child{position:sticky;left:0;background:var(--panel);z-index:1}
.sticky-first thead th:first-child{background:var(--accent);z-index:2}
input.cell{width:110px;text-align:right;padding:3px 6px;border-color:var(--line);background:var(--panel-2);color:var(--accent-2);font-weight:600}
input.cell:hover{border-color:var(--line-2)}
.entry{display:flex;flex-wrap:wrap;gap:10px;align-items:flex-end}
.entry label{display:flex;flex-direction:column;gap:3px;font-size:12px;color:var(--muted)}
.entry label input,.entry label select{color:var(--text);font-size:14px}
.entry label.grow{flex:1;min-width:180px}
.entry label.chk{flex-direction:row;align-items:center;gap:5px;padding-bottom:8px}
.entry input[name=amount]{width:130px;text-align:right;font-weight:700}
.entry input[name=place]{width:150px}
.entry .actions{display:flex;gap:6px}
#txForm.entry{display:grid;grid-template-columns:minmax(118px,1.15fr) auto minmax(80px,1.25fr) minmax(110px,2fr) minmax(90px,1.1fr) minmax(100px,1.3fr) minmax(82px,.95fr) minmax(86px,1fr) auto;gap:8px;align-items:end}
#txForm.entry label{min-width:0}
#txTable td.num,#txTable th.num{padding-right:14px}
#txTable td:first-child{white-space:nowrap}
#txForm.entry label input:not([type=checkbox]),#txForm.entry label select{width:100%}
#txForm.entry label.chk{white-space:nowrap}
#txForm.entry.editing .actions{gap:4px}
#txForm.entry.editing .actions button{padding:6px 9px}
@media (max-width:1100px){
  #txForm.entry{grid-template-columns:repeat(4,minmax(0,1fr))}
  #txForm.entry label.grow{grid-column:span 2}
}
@media (max-width:640px){
  #txForm.entry{grid-template-columns:repeat(2,minmax(0,1fr))}
}
.entry.editing{outline:2px dashed var(--accent-2);outline-offset:6px;border-radius:6px}
.filters{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:10px}
.filters input[type=search]{width:170px}
.filters .sum{margin-left:auto;font-weight:700}
.tx-filters{flex-wrap:nowrap;gap:6px;margin-bottom:6px}
.tx-filters>.msel,.tx-filters>select,.tx-filters>input[type=search]{flex:1 1 0;min-width:0;width:auto}
.tx-filters>input[type=search]{flex-grow:1.4}
.tx-filters>.msel>.msel-btn{width:100%;min-width:0;max-width:none}
.tx-filters>button{flex:none}
.tx-sumline{display:flex;justify-content:flex-end;margin-bottom:8px;font-weight:700}
@media (max-width:1000px){.tx-filters{flex-wrap:wrap}.tx-filters>.msel,.tx-filters>select,.tx-filters>input[type=search]{flex:1 1 130px}}
.msel{position:relative}
.msel-btn:not(.on){color:var(--muted)}
.msel-btn{min-width:96px;max-width:170px;text-align:left;padding:6px 26px 6px 10px;position:relative;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.msel-btn::after{content:"";position:absolute;right:10px;top:50%;margin-top:-3px;border:4px solid transparent;border-top-color:currentColor;border-bottom:0}
.msel-btn.on{border-color:var(--accent-2);color:var(--accent-2);font-weight:600;background:var(--accent-soft)}
.msel-pop{position:absolute;z-index:40;top:calc(100% + 4px);left:0;background:var(--panel);border:1px solid var(--line-2);border-radius:10px;box-shadow:0 10px 28px rgba(0,0,0,.18);padding:8px;min-width:200px}
.msel-tools{display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:12px;color:var(--muted);padding:2px 4px 6px;border-bottom:1px solid var(--line);margin-bottom:6px;white-space:nowrap}
.msel-list{max-height:320px;overflow:auto;display:flex;flex-direction:column}
.msel-list.grid3{display:grid;grid-template-columns:repeat(3,minmax(64px,1fr))}
.msel-list label{display:flex;gap:6px;align-items:center;padding:4px 6px;border-radius:6px;cursor:pointer;white-space:nowrap}
.msel-list label:hover{background:var(--panel-2)}
.msel-list label span{overflow:hidden;text-overflow:ellipsis}
.msel-list label[hidden]{display:none}
.msel-pop.wide{width:300px}
.msel-search{width:100%;margin-bottom:6px}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.toolbar .hint{color:var(--muted);font-size:12px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px}
.chip{display:inline-flex;align-items:center;gap:4px;background:var(--accent-soft);border-radius:999px;padding:3px 6px 3px 10px;font-size:13px}
.chip button{border:0;background:none;padding:0 4px;color:var(--muted);line-height:1}
.addline{display:flex;gap:6px}
.months{display:grid;grid-template-columns:repeat(12,minmax(64px,1fr));gap:6px;overflow-x:auto}
.months .mb{border:1px solid var(--line);border-radius:8px;padding:6px 8px;background:var(--panel-2);font-size:12px}
.months .mb b{display:block;font-size:13px;font-variant-numeric:tabular-nums}
.months .mb.now{border-color:var(--accent-2);background:var(--accent-soft)}
.months .mb.soon{border-color:var(--warn-line);background:var(--warn-bg)}
.vsbar{position:relative;height:12px;background:var(--panel-2);border-radius:3px}
.vsbar i{position:absolute;left:0;top:0;bottom:0;background:var(--c2);border-radius:3px}
.vsbar i.over{background:var(--neg)}
.vsbar b{position:absolute;top:-3px;bottom:-3px;width:2px;margin-left:-1px;background:var(--text)}
.warn-t{color:#c77700}
.subh{font-size:13px;margin:0 0 4px;color:var(--text);display:flex;justify-content:space-between;gap:8px}
.subh span{color:var(--muted);font-weight:400}
.list-recent{display:flex;flex-direction:column}
.list-recent div span.neg{color:var(--neg)}
.list-recent div{display:flex;gap:10px;padding:6px 0;border-bottom:1px solid var(--line);font-size:13px}
.list-recent div span:first-child{color:var(--muted);width:78px;flex:none}
.list-recent div span.m{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.list-recent div b{font-variant-numeric:tabular-nums}
dialog{border:1px solid var(--line);border-radius:12px;padding:0;background:var(--panel);color:var(--text);width:min(560px,calc(100vw - 32px));box-shadow:0 12px 40px rgba(0,0,0,.25)}
dialog::backdrop{background:rgba(10,15,25,.45)}
.modal h3{margin:0;padding:14px 18px;border-bottom:1px solid var(--line);font-size:16px}
.mbody{padding:14px 18px;display:grid;grid-template-columns:1fr 1fr;gap:10px 12px;max-height:65vh;overflow:auto}
.mbody .full{grid-column:1/-1}
.mfoot{display:flex;gap:8px;padding:12px 18px;border-top:1px solid var(--line)}
.field{display:flex;flex-direction:column;gap:3px;font-size:12px;color:var(--muted)}
.field input,.field select{font-size:14px;color:var(--text)}
.bulk{grid-column:1/-1}
.bulk table{width:100%}
.bulk input.cell{width:100px}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(20px);background:var(--text);color:var(--bg);padding:9px 16px;border-radius:8px;opacity:0;transition:.2s;pointer-events:none;z-index:99;max-width:calc(100vw - 32px)}
#toast.show{opacity:1;transform:translateX(-50%)}
.help{color:var(--muted);font-size:13px;line-height:1.7}
.help b{color:var(--text)}
.help ol,.help ul{padding-left:20px;margin:6px 0}
@media (max-width:800px){
  .layout{display:block}
  nav#tabs{position:sticky;top:57px;z-index:15;width:auto;height:auto;flex-direction:row;overflow-x:auto;scrollbar-width:none;padding:6px 10px;border-right:0;border-bottom:1px solid var(--line)}
  nav#tabs button{border-left:0;border-bottom:2px solid transparent;border-radius:0}
  nav#tabs button.on{background:none;border-bottom-color:var(--accent)}
}
@media (max-width:640px){
  .bar{flex-wrap:wrap}
  .mbody{grid-template-columns:1fr}
  .entry label,.entry label.grow{flex:1 1 140px}
  .entry input[name=amount],.entry input[name=place]{width:100%}
  .filters input[type=search]{width:100%}
  .filters .sum{margin-left:0;width:100%}
  .kpi .v{font-size:20px}
}
[hidden]{display:none!important}
.kpi .v .u{font-size:14px;color:var(--muted);font-weight:500;margin-left:2px}
.pbar{height:8px;background:var(--panel-2);border:1px solid var(--line);border-radius:999px;overflow:hidden;margin-top:6px}
.pbar>i{display:block;height:100%;background:var(--accent-2);border-radius:999px}
.pbar.done>i{background:var(--pos)}
.daybar{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 12px}
.daybar .dtitle{display:flex;align-items:center;gap:8px;font-size:17px}
button.nav{width:40px;height:36px;padding:0;font-size:14px}
.badge{font-size:11px;background:var(--accent);color:#fff;border-radius:999px;padding:2px 8px}
.grp{margin-bottom:10px}
.grp-h{font-size:12px;font-weight:700;color:var(--muted);margin:6px 2px;display:flex;justify-content:space-between;align-items:center}
.rt{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:10px 12px;margin-bottom:6px;border-radius:10px;border:1px solid var(--line);background:var(--panel)}
.rt:hover{background:var(--panel-2)}
.rt .ic{font-size:20px;width:28px;text-align:center;flex:none}
.rt .nm{flex:1;display:flex;flex-direction:column;font-weight:600;min-width:0}
.rt .nm small{font-weight:400;color:var(--muted);font-size:12px}
.rt .ck{width:28px;height:28px;border-radius:50%;border:2px solid var(--line-2);display:grid;place-items:center;font-weight:700;flex:none;color:#fff}
.rt.on{background:var(--accent-soft);border-color:var(--accent-2)}
.rt.on .ck{background:var(--pos);border-color:var(--pos)}
.rt.on .nm{color:var(--muted);text-decoration:line-through;text-decoration-color:var(--line-2)}

<header class="top">

    <main id="main"></main>
  </div>
</div>
<dialog id="dlg"></dialog>
<div id="toast" role="status"></div>
<script>
'use strict';
/* ====================== 기본 상수 · 유틸 ====================== */
const APP = 'mokpyo';
const K_DOC = 'mokpyo.doc', K_DIRTY = 'mokpyo.dirty', K_FILE = 'mokpyo.file', K_TAB = 'mokpyo.tab', K_LPATH = 'mokpyo.ledgerPath';
const LEDGER_DEFAULT = '/개인문서/가계부_데이터.json';
const COLS = ['routines', 'checks', 'goals', 'todos', 'reviews']; // 예전 'tasks'(할 일)·'journal'(오늘의 메모)는 2026-10-08 없앰 → To-do로 대체
const TABS = [['today', '오늘'], ['routine', '루틴'], ['goal', '목표'], ['review', '회고'], ['set', '설정']];
const DEFAULT_AREAS = [{ id: 'health', name: '건강', icon: '💪' }, { id: 'work', name: '일·사업', icon: '💼' }, { id: 'money', name: '재정', icon: '💰' }, { id: 'growth', name: '자기계발', icon: '📚' }, { id: 'hobby', name: '취미', icon: '🎨' }];
const LEVELS = [['long', '장기 목표 (3~5년)'], ['year', '올해 목표'], ['month', '이번 달 목표']];
const STATUS = ['진행', '완료', '보류'];
const DOW = '일월화수목금토';

const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const pad = n => String(n).padStart(2, '0');
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
const won = n => Math.round(+n || 0).toLocaleString('ko-KR');
const num = s => { if (typeof s === 'number') return s; const v = parseFloat(String(s ?? '').replace(/[^\d.\-]/g, '')); return isFinite(v) ? v : 0; };
const clamp = v => Math.max(0, Math.min(1, v));
const pctTxt = p => p == null ? '-' : Math.round(p * 100) + '%';
function lsGet(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }
function lsSet(k, v) { try { localStorage.setItem(k, v); } catch (e) { } }
function opts(list, sel, blank) { return (blank != null ? `<option value="">${esc(blank)}</option>` : '') + list.map(o => { const [v, l] = Array.isArray(o) ? o : [o, o]; return `<option value="${esc(v)}"${String(v) === String(sel ?? '') ? ' selected' : ''}>${esc(l)}</option>`; }).join(''); }
function toast(msg) { const t = $('#toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(t._t); t._t = setTimeout(() => t.classList.remove('show'), 2600); }
function download(name, text, type) { const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([text], { type })); a.download = name; document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 500); }
// 날짜 (모두 'YYYY-MM-DD' 문자열, 주는 월요일 시작)
const ds = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const today = () => ds(new Date());
const pd = s => { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); };
const addDays = (s, n) => { const d = pd(s); d.setDate(d.getDate() + n); return ds(d); };
const weekStart = s => { const d = pd(s); d.setDate(d.getDate() - (d.getDay() + 6) % 7); return ds(d); };
const dlabel = s => { const d = pd(s); return `${d.getMonth() + 1}월 ${d.getDate()}일 (${DOW[d.getDay()]})`; };
const mlabel = s => { const d = pd(s); return `${d.getMonth() + 1}.${d.getDate()}`; };

/* ====================== 데이터 문서 · 병합 (가계부와 같은 방식) ====================== */
function emptyDoc() { const o = { app: APP, schema: 1, meta: { upd: 0, areas: DEFAULT_AREAS } }; for (const c of COLS) o[c] = []; return o; }
function normalize(d) {
  d = d || {}; const e = emptyDoc();
  const o = { app: APP, schema: 1, meta: Object.assign(e.meta, d.meta || {}) };
  for (const c of COLS) o[c] = Array.isArray(d[c]) ? d[c] : [];
  return o;
}
function merge(a, b) {
  a = normalize(a); b = normalize(b);
  const o = { app: APP, schema: 1, meta: (b.meta.upd || 0) > (a.meta.upd || 0) ? b.meta : a.meta };
  for (const c of COLS) {
    const m = new Map();
    for (const r of a[c]) m.set(r.id, r);
    for (const r of b[c]) { const x = m.get(r.id); if (!x || (r.upd || 0) > (x.upd || 0)) m.set(r.id, r); }
    o[c] = [...m.values()];
  }
  return o;
}
function prune() { const lim = Date.now() - 180 * 864e5; for (const c of COLS) doc[c] = doc[c].filter(r => !r.del || (r.upd || 0) > lim); }
const live = c => doc[c].filter(r => !r.del);
function put(col, rec) { rec.upd = Date.now(); const a = doc[col]; const i = a.findIndex(r => r.id === rec.id); if (i >= 0) a[i] = rec; else a.push(rec); if (col === 'checks') CHK.set(rec.id, rec); }
function remove(col, id) { put(col, { id, del: 1 }); }
function setMeta(fn) { const m = JSON.parse(JSON.stringify(doc.meta)); fn(m); m.upd = Date.now(); doc.meta = m; }
const hasData = () => COLS.some(c => doc[c].length) || doc.meta.upd;

/* ====================== 상태 ====================== */
let doc = (() => { try { return normalize(JSON.parse(lsGet(K_DOC) || 'null')); } catch (e) { return emptyDoc(); } })();
let fh = null, stored = null, connected = false, dirty = lsGet(K_DIRTY) === '1';
let saving = false, saveAgain = false, saveT = null, lastSaved = null, lastErr = '', pendingRender = false;
const fsOK = 'showOpenFilePicker' in window;
const ui = { tab: lsGet(K_TAB) || 'today', date: today(), week: weekStart(today()), gy: new Date().getFullYear(), gm: new Date().getMonth() + 1 };
if (!TABS.some(t => t[0] === ui.tab)) ui.tab = 'today';
function cacheDoc() { lsSet(K_DOC, JSON.stringify(doc)); lsSet(K_DIRTY, dirty ? '1' : '0'); }
function commit(rerender = true) {
  dirty = true; cacheDoc(); setStatus();
  clearTimeout(saveT); saveT = setTimeout(saveNow, 700);
  if (rerender) setTimeout(render, 0);
}
let CHK = new Map();   // 체크 기록 색인: 'c-날짜-루틴id' → 기록
function rebuildIndex() { CHK = new Map(); for (const c of doc.checks) CHK.set(c.id, c); }
/* ====================== 저장소: PC 파일 연결 또는 Microsoft 계정(OneDrive) 로그인 ======================
   - PC(Edge·Chrome으로 파일을 직접 열 때): File System Access로 OneDrive 폴더의 json 파일에 직접 저장
   - 휴대폰·태블릿(또는 인터넷 주소로 열 때): Microsoft 계정으로 로그인해 Microsoft Graph로 같은 json 파일을 읽고 씀
   두 방식 모두 같은 파일을 쓰고, 기록 단위 병합(merge)으로 동시에 고쳐도 내용이 합쳐짐 */
const MS = {
  clientId: 'e68213fc-a095-4937-a748-f30e52d93c63',   // Azure 앱 등록의 「애플리케이션(클라이언트) ID」 — 비밀번호가 아니라 공개돼도 되는 값
  authority: 'https://login.microsoftonline.com/consumers',
  scopes: ['Files.ReadWrite'],
  lib: 'https://cdn.jsdelivr.net/npm/@azure/msal-browser@3.28.1/lib/msal-browser.min.js',
  sri: 'sha384-B5PXeUfgiegchZiX5iMRssMrHd9NfPhFnITob1HyW1CY76udptWpBsniaDsH/+BY'
};
const K_MODE = 'mokpyo.mode', K_PATH = 'mokpyo.path', DEFAULT_PATH = '/개인문서/목표관리_데이터.json';
const msOK = () => !!MS.clientId && (location.protocol === 'https:' || location.hostname === 'localhost');
function dataPath() { return lsGet(K_PATH) || DEFAULT_PATH; }
function storeMode() {
  const m = lsGet(K_MODE);
  if (m === 'file' && fsOK) return 'file';
  if (m === 'ms' && msOK()) return 'ms';
  if (fsOK && location.protocol === 'file:') return 'file';
  if (msOK()) return 'ms';
  return fsOK ? 'file' : 'none';
}
let store = null, lastVer = '', lastPoll = 0;

function idb() { return new Promise((res, rej) => { const r = indexedDB.open('mokpyo', 1); r.onupgradeneeded = () => r.result.createObjectStore('kv'); r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); }); }
function idbGet(k) { return Promise.race([idbGet0(k), new Promise(r => setTimeout(() => r(null), 2000))]); }
async function idbGet0(k) { try { const db = await idb(); return await new Promise((res, rej) => { const q = db.transaction('kv').objectStore('kv').get(k); q.onsuccess = () => res(q.result); q.onerror = () => rej(q.error); }); } catch (e) { return null; } }
async function idbSet(k, v) { try { const db = await idb(); await new Promise((res, rej) => { const t = db.transaction('kv', 'readwrite'); t.objectStore('kv').put(v, k); t.oncomplete = res; t.onerror = () => rej(t.error); }); } catch (e) { } }
const PICK_TYPES = [{ description: '목표관리 데이터 (JSON)', accept: { 'application/json': ['.json'] } }];

// ---- PC 파일 저장소
function fileStore(h) {
  return {
    kind: 'file', name: h.name,
    async version() { return String((await h.getFile()).lastModified); },
    async read() { const f = await h.getFile(); return { text: await f.text(), version: String(f.lastModified), time: new Date(f.lastModified) }; },
    async write(text) { const w = await h.createWritable(); await w.write(text); await w.close(); return String((await h.getFile()).lastModified); }
  };
}
// ---- Microsoft 계정(OneDrive) 저장소
let msal = null, msAccount = null;
function loadScript(src, sri) {
  return new Promise((res, rej) => { const s = document.createElement('script'); s.src = src; if (sri) { s.integrity = sri; s.crossOrigin = 'anonymous'; } s.onload = res; s.onerror = () => rej(new Error('로그인 모듈을 불러오지 못했습니다. 인터넷 연결을 확인하세요')); document.head.appendChild(s); });
}
async function msInit() {
  if (msal) return msal;
  if (!window.msal) await loadScript(MS.lib, MS.sri);
  const app = new window.msal.PublicClientApplication({ auth: { clientId: MS.clientId, authority: MS.authority, redirectUri: location.origin + location.pathname }, cache: { cacheLocation: 'localStorage' } });
  await app.initialize();
  const r = await app.handleRedirectPromise();
  msal = app; msAccount = (r && r.account) || app.getAllAccounts()[0] || null;
  return msal;
}
async function msToken(interactive) {
  await msInit();
  if (!msAccount) { if (interactive) await msal.loginRedirect({ scopes: MS.scopes, prompt: 'select_account' }); return null; }
  try { return (await msal.acquireTokenSilent({ scopes: MS.scopes, account: msAccount })).accessToken; }
  catch (e) { if (interactive) { await msal.acquireTokenRedirect({ scopes: MS.scopes, account: msAccount }); return null; } const x = new Error('다시 로그인해 주세요'); x.name = 'NotAllowedError'; throw x; }
}
async function gfetch(path, opt = {}) {
  const t = await msToken(false);
  if (!t) { const x = new Error('Microsoft 계정 로그인이 필요합니다'); x.name = 'NotAllowedError'; throw x; }
  return fetch('https://graph.microsoft.com/v1.0' + path, { ...opt, cache: 'no-store', headers: { ...(opt.headers || {}), Authorization: 'Bearer ' + t } });
}
const gItem = () => '/me/drive/root:' + dataPath().split('/').map(encodeURIComponent).join('/');
function gErr(r) { const x = new Error(r.status === 404 ? `OneDrive에서 「${dataPath()}」 파일을 찾지 못했습니다` : `OneDrive 응답 오류(${r.status})`); if (r.status === 404) x.name = 'NotFoundError'; if (r.status === 401 || r.status === 403) x.name = 'NotAllowedError'; return x; }
function msStore() {
  return {
    kind: 'ms', name: dataPath().split('/').pop(),
    async version() { const r = await gfetch(gItem() + '?$select=eTag'); if (!r.ok) throw gErr(r); return (await r.json()).eTag; },
    async read() {
      const r = await gfetch(gItem()); if (!r.ok) throw gErr(r);
      const j = await r.json(), c = await fetch(j['@microsoft.graph.downloadUrl'], { cache: 'no-store' });
      if (!c.ok) throw new Error(`OneDrive 파일 내려받기 오류(${c.status})`);
      return { text: await c.text(), version: j.eTag, time: new Date(j.lastModifiedDateTime) };
    },
    async write(text, ver) {
      const r = await gfetch(gItem() + ':/content', { method: 'PUT', headers: { 'Content-Type': 'application/json', ...(ver ? { 'If-Match': ver } : {}) }, body: text });
      if (r.status === 412) { const x = new Error('다른 기기가 먼저 저장함'); x.conflict = true; throw x; }
      if (!r.ok) throw gErr(r);
      return (await r.json()).eTag;
    }
  };
}
async function msLogout() { try { await msInit(); if (msAccount) await msal.logoutRedirect({ account: msAccount }); } catch (e) { toast('로그아웃 실패: ' + e.message); } }

// ---- 연결 (버튼)
async function connect() {
  try {
    if (storeMode() === 'ms') {
      const t = await msToken(true); if (!t) return;          // 로그인 화면으로 넘어감 → 돌아오면 init에서 이어서 연결
      store = msStore(); await openStore(); return;
    }
    if (!fsOK) { toast('이 브라우저에서는 파일에 직접 저장할 수 없습니다'); return; }
    if (stored) {
      const p = await stored.requestPermission({ mode: 'readwrite' });
      if (p === 'granted') { fh = stored; store = fileStore(fh); await openStore(); return; }
    }
    const [h] = await window.showOpenFilePicker({ types: PICK_TYPES, multiple: false });
    fh = stored = h; idbSet('file', h); store = fileStore(h); await openStore();
  } catch (e) { if (e.name !== 'AbortError') { lastErr = e.message; toast('연결 실패: ' + e.message); setStatus(); renderBanner(); } }
}
async function createFile() {
  try {
    const h = await window.showSaveFilePicker({ suggestedName: '목표관리_데이터.json', types: PICK_TYPES });
    fh = stored = h; idbSet('file', h); store = fileStore(h); lsSet(K_MODE, 'file');
    connected = true; lsSet(K_FILE, h.name); dirty = true;

function safeRender() { if (isEditing() || $('#dlg').open) pendingRender = true; else render(); }
document.addEventListener('focusout', () => setTimeout(() => { if (pendingRender && !isEditing() && !$('#dlg').open) { pendingRender = false; render(); } }, 400));
const VIEWS = {}, AFTER = {};
function render() {
  rebuildIndex();
  const ae = document.activeElement, keep = ae && ae.dataset ? ae.dataset.keep : null;
  $('#main').innerHTML = (VIEWS[ui.tab] || VIEWS.today)();
  AFTER[ui.tab]?.();
  if (keep) { const el = $('#main').querySelector(`[data-keep="${CSS.escape(keep)}"]`); if (el) el.focus(); }
}
const bar = (p, cls = '') => `<div class="pbar ${cls}"><i style="width:${p == null ? 0 : (p * 100).toFixed(1)}%"></i></div>`;

/* ====================== 화면: 오늘 ====================== */
VIEWS.today = () => {
  const d = ui.date, isToday = d === today(), st = dayStat(d), ws = weekStart(d);
  const rs = routinesSorted().filter(r => isWeekly(r) ? activeOn(r, d) : scheduled(r, d));
  const todos = todosOn(d), upcoming = isToday ? live('todos').filter(t => !t.done && t.date > d).sort((a, b) => a.date.localeCompare(b.date)) : [];
  let wkAll = 0, wkDone = 0; for (let i = 0; i < 7; i++) { const x = addDays(ws, i); if (x > today()) break; const s = dayStat(x); wkAll += s.all; wkDone += s.done; }
  const groups = areas().map(a => ({ a, list: rs.filter(r => r.area === a.id) })).concat([{ a: { id: '', name: '기타', icon: '📌' }, list: rs.filter(r => !areas().some(a => a.id === r.area)) }]).filter(g => g.list.length);
  const rtRow = r => {
    const done = isDone(r, d), wk = isWeekly(r), s = streak(r);
    const meta = wk ? `이번 주 ${weekDone(r, ws)}/${r.freq.n || 1}` : (s ? `🔥 ${s}일 연속` : freqText(r));
    return `<button class="rt${done ? ' on' : ''}" data-act="rtToggle" data-id="${esc(r.id)}"><span class="ic">${esc(r.icon || '✔️')}</span><span class="nm">${esc(r.name)}<small>${meta}${isAuto(r, d) ? ' · 가계부 입력으로 자동 체크' : ''}</small></span><span class="ck">${done ? '✓' : ''}</span></button>`;
  };
  const monthGoals = live('goals').filter(g => g.level === 'month' && g.period === d.slice(0, 7) && g.status !== '보류');
  return `
  <div class="daybar card">
    <button class="nav" data-act="dayMove" data-n="-1" aria-label="전날">◀</button>
    <div class="dtitle"><b>${dlabel(d)}</b>${isToday ? '<span class="badge">오늘</span>' : '<button class="link" data-act="dayToday">오늘로</button>'}</div>
    <button class="nav" data-act="dayMove" data-n="1" aria-label="다음날">▶</button>
  </div>
  <div class="kpis">
    <div class="kpi"><div class="l">${isToday ? '오늘' : '이날'} 루틴</div><div class="v">${st.done}<span class="u">/${st.all}</span></div>${bar(st.p)}</div>
    <div class="kpi"><div class="l">${isToday ? '오늘' : '이날'} To-do</div><div class="v">${todos.filter(t => t.done).length}<span class="u">/${todos.length}</span></div>${bar(todos.length ? todos.filter(t => t.done).length / todos.length : null)}</div>
    <div class="kpi"><div class="l">이번 주 루틴 달성률</div><div class="v">${pctTxt(wkAll ? wkDone / wkAll : null)}</div>${bar(wkAll ? wkDone / wkAll : null)}</div>
    <div class="kpi"><div class="l">이번 달 목표</div><div class="v">${monthGoals.filter(g => g.status === '완료').length}<span class="u">/${monthGoals.length} 완료</span></div>${bar(monthGoals.length ? monthGoals.reduce((a, g) => a + (goalProgress(g) || 0), 0) / monthGoals.length : null)}</div>
  </div>
  <div class="today-grid">
    <div class="card"><h2>${isToday ? '오늘의' : '이날'} 루틴 <small>${st.all - st.done ? `남은 루틴 ${st.all - st.done}개` : st.all ? '모두 완료 🎉' : ''} · 누르면 체크, 다시 누르면 해제</small></h2>
      ${groups.map(g => { const daily = g.list.filter(r => !isWeekly(r)), n = daily.filter(r => isDone(r, d)).length; /* 영역 숫자는 위 「오늘 루틴」과 같은 기준(주 N회 루틴 제외) */ return `<div class="grp"><div class="grp-h"><span>${esc(g.a.icon)} ${esc(g.a.name)}</span>${daily.length ? `<span class="gcnt${n === daily.length ? ' full' : ''}">${n}/${daily.length}</span>` : ''}</div><div class="rt-grid">${g.list.map(rtRow).join('')}</div></div>`; }).join('') || `<p class="muted">이날 할 루틴이 없습니다. <button class="link" data-act="go" data-tab="routine">루틴 추가 →</button></p>`}
    </div>
    <div class="stack">
      <div class="card"><h2>${isToday ? '오늘의' : '이날'} To-do <small>못 한 것은 다음 날로 자동으로 넘어감</small></h2>
        <form class="addtask" data-form="todo"><input name="title" placeholder="할 일 입력 후 Enter" autocomplete="off" data-keep="todoInput"><input type="date" name="date" value="${d}" title="해야 하는 날"><button class="primary" type="submit">추가</button></form>
        ${todoSections(todos, upcoming, d)}
      </div>
      ${monthGoals.length ? `<div class="card"><h2>${+d.slice(5, 7)}월 목표 <small><button class="link" data-act="go" data-tab="goal">목표 보기 →</button></small></h2>${monthGoals.map(g => `<div class="gmini"><span>${esc(areaOf(g.area).icon)} ${esc(g.title)}</span>${bar(goalProgress(g), g.status === '완료' ? 'done' : '')}<b>${pctTxt(goalProgress(g))}</b></div>`).join('')}</div>` : ''}
    </div>
  </div>`;
};
// To-do: {id, date(해야 하는 날), title, done, doneDate}. 오늘 화면에는 오늘 할 것 + 못 한 채 지난 것(자동으로 넘어옴) + 오늘 끝낸 넘어온 것
function todosOn(d) {
  const isT = d === today();
  return live('todos').filter(t => t.date === d || (isT && t.date < d && (!t.done || t.doneDate === d)))
    .sort((a, b) => (a.done ? 1 : 0) - (b.done ? 1 : 0) || a.date.localeCompare(b.date) || (a.upd || 0) - (b.upd || 0));
}
// To-do를 넘어온 일 / 오늘 할 일 / 완료 / 예정으로 나눠서 보여 줌
function todoSections(todos, upcoming, d) {
  const late = todos.filter(t => !t.done && t.date < d), now = todos.filter(t => !t.done && t.date >= d), done = todos.filter(t => t.done);
  const sec = (label, list, cls = '') => list.length ? `<div class="tdsec"><div class="grp-h ${cls}"><span>${label}</span><span class="gcnt">${list.length}</span></div><div class="tasks">${list.map(t => todoRow(t, d)).join('')}</div></div>` : '';
  const isT = d === today();
  const body = sec('⚠ 넘어온 일', late, 'late') + sec(isT ? '오늘 할 일' : '이날 할 일', now) + sec('✓ 완료', done, 'dim')
    + (upcoming.length ? sec('예정', upcoming.slice(0, 10), 'dim') + (upcoming.length > 10 ? `<p class="muted">외 ${upcoming.length - 10}건</p>` : '') : '');
  return body || '<p class="muted">To-do가 없습니다. 위 칸에 적고 Enter를 누르세요.</p>';
}
function todoRow(t, d) {
  const note = t.date < d ? `${mlabel(t.date)}부터 넘어옴` : t.date > d ? `${mlabel(t.date)} 예정` : '';
  return `<div class="task${t.done ? ' on' : ''}${t.date < d && !t.done ? ' late' : ''}"><button class="tck" data-act="todoToggle" data-id="${esc(t.id)}" aria-label="완료">${t.done ? '✓' : ''}</button><span class="tt">${esc(t.title)}${note ? `<small>${note}</small>` : ''}</span><button class="sm ghost" data-act="todoDel" data-id="${esc(t.id)}" aria-label="삭제">×</button></div>`;
}

/* ====================== 화면: 루틴 ====================== */
VIEWS.routine = () => {
  const ws = ui.week, days = [...Array(7).keys()].map(i => addDays(ws, i)), t = today();
  const rows = []; let lastArea = null;
  const list = routinesSorted().slice().sort((a, b) => areas().findIndex(x => x.id === a.area) - areas().findIndex(x => x.id === b.area) || (a.order ?? 0) - (b.order ?? 0));
  for (const r of list) {
    if (r.area !== lastArea) { const a = areaOf(r.area); rows.push(`<tr class="blk"><td colspan="11">${esc(a.icon)} ${esc(a.name)}</td></tr>`); lastArea = r.area; }
    const wk = isWeekly(r), wd = weekDone(r, ws), sch = days.filter(d => d <= t && scheduled(r, d)).length;
    rows.push(`<tr class="${r.active === false ? 'off' : ''}"><td><button class="link rname" data-act="rtEdit" data-id="${esc(r.id)}">${esc(r.icon || '')} ${esc(r.name)}</button><small class="muted"> ${freqText(r)}${r.auto === 'ledger' ? ' · 가계부 자동' : ''}${r.active === false ? ' · 중지' : ''}</small></td>
      ${days.map(d => { const on = isDone(r, d), sc = scheduled(r, d) && (!wk || true), fut = d > t; return `<td class="cell"><button class="ckc${on ? ' on' : ''}${!sc ? ' na' : ''}${isAuto(r, d) ? ' auto' : ''}" data-act="cellToggle" data-id="${esc(r.id)}" data-d="${d}" ${fut ? 'disabled' : ''}>${on ? '✓' : sc ? '' : '·'}</button></td>`; }).join('')}
      <td class="num">${wk ? `${wd}/${r.freq.n || 1}` : `${wd}/${sch}`}</td><td class="num">${streak(r) ? '🔥' + streak(r) : '-'}</td><td class="num">${pctTxt(rate(r))}</td></tr>`);
  }
  const we = addDays(ws, 6);
  return `<div class="card">
    <div class="toolbar"><button class="nav" data-act="weekMove" data-n="-7">◀</button><b>${mlabel(ws)} ~ ${mlabel(we)}</b><button class="nav" data-act="weekMove" data-n="7">▶</button>${ws !== weekStart(t) ? '<button class="link" data-act="weekNow">이번 주</button>' : ''}<span class="spacer"></span><button class="primary" data-act="rtAdd">+ 루틴 추가</button></div>
    <div class="tablewrap"><table class="grid rtable"><thead><tr><th>루틴</th>${days.map(d => `<th class="${d === t ? 'today' : ''}">${DOW[pd(d).getDay()]}<br><small>${pd(d).getDate()}</small></th>`).join('')}<th>이번 주</th><th>연속</th><th>30일</th></tr></thead><tbody>${rows.join('') || '<tr><td colspan="11" class="muted" style="padding:20px;text-align:center">루틴이 없습니다. 「+ 루틴 추가」를 눌러 시작하세요.</td></tr>'}</tbody></table></div>
    <p class="help">칸을 누르면 그날 체크/해제됩니다. 「·」은 쉬는 날(요일 지정 루틴). 주 N회 루틴은 아무 날이나 체크하면 됩니다. 루틴 이름을 누르면 수정할 수 있습니다.</p>
  </div>`;
};
function editRoutine(id) {
  const r = id ? doc.routines.find(x => x.id === id) : { name: '', icon: '', area: areas()[0].id, freq: { type: 'daily' }, active: true, start: today() };
  const f = r.freq || { type: 'daily' };
  const body = `
    <label class="field"><span>아이콘 (이모지)</span><input name="icon" value="${esc(r.icon || '')}" maxlength="4" placeholder="예: 🏃"></label>
    <label class="field"><span>루틴 이름</span><input name="name" value="${esc(r.name)}" required></label>
    <label class="field"><span>영역</span><select name="area">${opts(areas().map(a => [a.id, `${a.icon} ${a.name}`]), r.area)}</select></label>
    <label class="field"><span>주기</span><select name="ftype">${opts([['daily', '매일'], ['days', '요일 지정'], ['weekly', '주 N회 (아무 날이나)']], f.type)}</select></label>
    <div class="field full" data-show="days"><span>요일</span><div class="days">${[1, 2, 3, 4, 5, 6, 0].map(i => `<label><input type="checkbox" name="day" value="${i}"${(f.days || []).includes(i) ? ' checked' : ''}> ${DOW[i]}</label>`).join('')}</div></div>
    <label class="field" data-show="weekly"><span>주 몇 회</span><input name="n" type="number" min="1" max="7" value="${f.n || 3}"></label>
    <label class="field"><span>시작일</span><input name="start" type="date" value="${esc(r.start || '')}"></label>
    <label class="field chk"><input type="checkbox" name="active"${r.active !== false ? ' checked' : ''}> 사용 중 (끄면 오늘 화면에서 숨김, 기록은 남음)</label>
    <label class="field chk full"><input type="checkbox" name="auto"${r.auto === 'ledger' ? ' checked' : ''}> 가계부에 그날 지출을 입력하면 자동으로 체크</label>`;
  openModal({
    title: id ? '루틴 수정' : '루틴 추가', body,
    onMount: fm => { const sync = () => { const t = fm.ftype.value; fm.querySelectorAll('[data-show]').forEach(el => { el.hidden = el.dataset.show !== t; }); }; fm.ftype.onchange = sync; sync(); },
    onSubmit: fm => {
      const name = fm.name.value.trim(); if (!name) { toast('루틴 이름을 입력하세요'); return false; }
      const type = fm.ftype.value, days = [...fm.querySelectorAll('input[name=day]:checked')].map(x => +x.value);
      if (type === 'days' && !days.length) { toast('요일을 하나 이상 고르세요'); return false; }
      const freq = type === 'days' ? { type, days } : type === 'weekly' ? { type, n: Math.max(1, Math.min(7, +fm.n.value || 1)) } : { type: 'daily' };
      const order = id ? r.order : Math.max(0, ...live('routines').map(x => x.order || 0)) + 1;
      put('routines', Object.assign({}, r, { id: id || uid(), name, icon: fm.icon.value.trim(), area: fm.area.value, freq, start: fm.start.value, active: fm.active.checked, auto: fm.auto.checked ? 'ledger' : '', order }));
      commit();
    },
    onDelete: id ? () => { remove('routines', id); commit(); toast('루틴을 삭제했습니다 (체크 기록은 남아 있음)'); } : null
  });
}

/* ====================== 화면: 목표 ====================== */
VIEWS.goal = () => {
  const Y = ui.gy, M = ui.gm, ym = ymOf(Y, M);
  const gRow = (g, cls, child = '') => { // child: 이 목표 아래에 하위 목표를 추가하는 버튼(마우스를 올리면 보임)
    const p = goalProgress(g), cur = goalCurrent(g), off = g.pmode === 'none'; // off: 진행률 표시 안 함
    return `<div class="goal ${cls}${g.status === '완료' ? ' done' : ''}${g.status === '보류' ? ' hold' : ''}">
      <div class="gtop"><button class="link gtitle" data-act="goalEdit" data-id="${esc(g.id)}">${esc(g.title)}</button><span class="gper">${esc(periodLabel(g))}${g.status !== '진행' && g.status ? ' · ' + esc(g.status) : ''}</span>${child}${off ? "" : `<b class="gp">${pctTxt(p)}</b>`}</div>
      ${off ? '' : bar(p, g.status === '완료' ? 'done' : '')}${cur ? `<div class="gcur">${cur}</div>` : ''}${g.note ? `<div class="gnote">${esc(g.note)}</div>` : ''}</div>`;
  };
  const addBtn = (label, area, level, parent, extra = '') => `<button class="sm addg${extra}" data-act="goalAdd" data-area="${esc(area)}" data-level="${level}" data-parent="${esc(parent || '')}">+ ${label}</button>`;
  const cards = areas().map(a => {
    const longs = goalsOf(a.id, 'long', null, undefined);
    const years = goalsOf(a.id, 'year', Y, undefined);
    const months = goalsOf(a.id, 'month', ym, undefined);
    const yp = years.map(g => goalProgress(g)).filter(p => p != null);
    let h = '';
    const monthsUnder = y => months.filter(m => m.parent === y.id);
    const yearBlock = y => gRow(y, 'lv-year', addBtn(`${M}월 목표`, a.id, 'month', y.id, ' gchild')) + monthsUnder(y).map(m => gRow(m, 'lv-month')).join('');
    for (const L of longs) {
      h += gRow(L, 'lv-long', addBtn(`${Y}년 목표`, a.id, 'year', L.id, ' gchild'));
      h += years.filter(y => y.parent === L.id).map(yearBlock).join('');
    }
    const orphanY = years.filter(y => !y.parent || !longs.some(L => L.id === y.parent));
    const orphanM = months.filter(m => !m.parent || !years.some(y => y.id === m.parent));
    if (orphanY.length) h += orphanY.map(yearBlock).join('');
    if (orphanM.length) h += orphanM.map(m => gRow(m, 'lv-month')).join('');
    return `<div class="card goalcard"><h2>${esc(a.icon)} ${esc(a.name)} <small>${Y}년 목표 ${years.length}개${yp.length ? ' · 평균 ' + pctTxt(yp.reduce((s, x) => s + x, 0) / yp.length) : ''}</small></h2>
      ${h || '<p class="muted">아직 목표가 없습니다.</p>'}
      <div class="gadd">${addBtn('장기 목표', a.id, 'long', '')}${addBtn(`${Y}년 목표`, a.id, 'year', '')}${addBtn(`${M}월 목표`, a.id, 'month', '')}</div></div>`;
  }).join('');
  return `<div class="card"><div class="toolbar">
      <select data-g="gy">${opts([Y - 1, Y, Y + 1].map(y => [y, y + '년']), Y)}</select>
      <select data-g="gm">${opts([...Array(12).keys()].map(i => [i + 1, (i + 1) + '월']), M)}</select>
      <span class="hint">큰 목표 → 올해 목표 → 이번 달 목표 순서로 나눠 적으면, 아래 단계 진행률이 위로 자동 반영됩니다.</span></div></div>
    <div class="row goals">${cards}</div>`;
};
function editGoal(id, preset) {
  const now = new Date();
  const g = id ? doc.goals.find(x => x.id === id) : Object.assign({ title: '', status: '진행', pmode: 'auto', pct: 0, unit: '', start: '', target: '', current: '', metric: '', note: '' }, preset);
  if (!id) g.period = g.level === 'long' ? `${now.getFullYear()}~${now.getFullYear() + 4}` : g.level === 'year' ? String(ui.gy) : ymOf(ui.gy, ui.gm);
  const parents = lv => lv === 'year' ? live('goals').filter(x => x.level === 'long' && x.area === g.area) : lv === 'month' ? live('goals').filter(x => x.level === 'year' && x.area === g.area) : [];
  const body = `
    <label class="field full"><span>목표</span><input name="title" value="${esc(g.title)}" placeholder="예: 체중 75kg 만들기" required></label>
    <label class="field"><span>영역</span><select name="area">${opts(areas().map(a => [a.id, `${a.icon} ${a.name}`]), g.area)}</select></label>
    <label class="field"><span>단계</span><select name="level">${opts(LEVELS, g.level)}</select></label>
    <label class="field"><span>기간</span><input name="period" value="${esc(g.period)}" placeholder="장기 2026~2030 / 올해 2026 / 월 2026-10"></label>
    <label class="field"><span>상위 목표</span><select name="parent">${opts(parents(g.level).map(x => [x.id, `${periodLabel(x)} · ${x.title}`]), g.parent, '(없음)')}</select></label>
    <label class="field"><span>진행률 계산</span><select name="pmode">${opts([['auto', '자동 (하위 목표 평균)'], ['manual', '직접 % 입력'], ['number', '숫자 목표 (현재값 / 목표값)'], ['none', '진행률 표시 안 함']], g.pmode)}</select></label>
    <label class="field"><span>상태</span><select name="status">${opts(STATUS, g.status)}</select></label>
    <label class="field" data-pm="manual"><span>진행률 (%)</span><input name="pct" type="number" min="0" max="100" value="${esc(g.pct ?? 0)}"></label>
    <label class="field" data-pm="number"><span>가계부·업무·루틴 값 연결</span><select name="metric">${opts(METRICS.concat(routinesSorted().map(r => ['rt:' + r.id, `루틴: ${r.name} — 그 달 한 날 수`]), /^rt:.*\+/.test(g.metric || '') ? [[g.metric, `루틴: ${g.metric.slice(3).split('+').map(id => (doc.routines.find(r => r.id === id) || { name: '?' }).name).join(' 또는 ')} — 그 달 한 날 수`]] : []), g.metric)}</select></label>
    <label class="field" data-pm="number"><span>단위 (예: 원, kg, 권)</span><input name="unit" value="${esc(g.unit || '')}"></label>
    <label class="field" data-pm="number"><span>시작값</span><input name="start" inputmode="decimal" value="${esc(g.start ?? '')}" placeholder="0"></label>
    <label class="field" data-pm="number"><span>목표값</span><input name="target" inputmode="decimal" value="${esc(g.target ?? '')}"></label>
    <label class="field" data-pm="number" data-manualcur><span>현재값</span><input name="current" inputmode="decimal" value="${esc(g.current ?? '')}"></label>
    <label class="field full"><span>메모 (왜 이 목표인지, 방법 등)</span><input name="note" value="${esc(g.note || '')}"></label>`;
  openModal({
    title: id ? '목표 수정' : `${(LEVELS.find(l => l[0] === g.level) || [, '목표'])[1]} 추가`, body,
    onMount: fm => {
      const sync = () => { const pm = fm.pmode.value; fm.querySelectorAll('[data-pm]').forEach(el => { el.hidden = el.dataset.pm !== pm; }); const mc = fm.querySelector('[data-manualcur]'); if (pm === 'number' && fm.metric.value) mc.hidden = true; };
      const syncParents = () => { const keep = fm.parent.value; const tmp = Object.assign({}, g, { area: fm.area.value }); g.area = fm.area.value; fm.parent.innerHTML = opts(parents(fm.level.value).map(x => [x.id, `${periodLabel(x)} · ${x.title}`]), keep, '(없음)'); g.area = tmp.area; };
      fm.pmode.onchange = sync; fm.metric.onchange = sync; fm.area.onchange = syncParents; fm.level.onchange = () => { syncParents(); const lv = fm.level.value, y = new Date().getFullYear(); fm.period.value = lv === 'long' ? `${y}~${y + 4}` : lv === 'year' ? String(ui.gy) : ymOf(ui.gy, ui.gm); };
      sync();
    },
    onSubmit: fm => {
      const title = fm.title.value.trim(); if (!title) { toast('목표를 입력하세요'); return false; }
      const level = fm.level.value; let period = fm.period.value.trim();
      if (level === 'year' && !/^\d{4}$/.test(period)) { toast('올해 목표의 기간은 2026처럼 연도로 적어 주세요'); return false; }
      if (level === 'month' && !/^\d{4}-\d{2}$/.test(period)) { toast('월 목표의 기간은 2026-10처럼 적어 주세요'); return false; }
      const rec = Object.assign({}, g, { id: id || uid(), title, area: fm.area.value, level, period, parent: fm.parent.value, pmode: fm.pmode.value, status: fm.status.value, pct: num(fm.pct.value), metric: fm.metric.value, unit: fm.unit.value.trim(), start: fm.start.value === '' ? '' : num(fm.start.value), target: fm.target.value === '' ? '' : num(fm.target.value), current: fm.current.value === '' ? '' : num(fm.current.value), note: fm.note.value.trim() });
      put('goals', rec); commit();
    },
    onDelete: id ? () => { const kids = childGoals(g).length; if (kids && !confirm(`하위 목표 ${kids}개가 있습니다. 이 목표만 지우고 하위 목표는 남길까요?`)) return; remove('goals', id); commit(); } : null
  });
}

/* ====================== 화면: 회고 ====================== */
VIEWS.review = () => {
  const ws = ui.week, days = [...Array(7).keys()].map(i => addDays(ws, i)), t = today();
  const rv = live('reviews').find(x => x.id === 'w-' + ws) || {};
  const st = days.map(d => d > t ? null : dayStat(d));
  const rrows = routinesSorted().filter(r => days.some(d => activeOn(r, d))).map(r => {
    const wd = weekDone(r, ws), goal = isWeekly(r) ? (r.freq.n || 1) : days.filter(d => d <= t && scheduled(r, d)).length;
    return `<div class="gmini"><span>${esc(r.icon || '')} ${esc(r.name)}</span>${bar(goal ? Math.min(1, wd / goal) : null, wd >= goal && goal ? 'done' : '')}<b>${wd}/${goal}</b></div>`;
  }).join('');
  const field = (k, label, ph) => `<label class="field full"><span>${label}</span><textarea data-review="${k}" data-keep="rv-${k}" rows="3" placeholder="${ph}">${esc(rv[k] || '')}</textarea></label>`;
  return `<div class="card"><div class="toolbar"><button class="nav" data-act="weekMove" data-n="-7">◀</button><b>${mlabel(ws)} ~ ${mlabel(addDays(ws, 6))} 주간 회고</b><button class="nav" data-act="weekMove" data-n="7">▶</button>${ws !== weekStart(t) ? '<button class="link" data-act="weekNow">이번 주</button>' : ''}</div>
    <div class="weekdots">${days.map((d, i) => `<div class="wd${d === t ? ' today' : ''}"><span>${DOW[pd(d).getDay()]}</span>${st[i] ? `<b>${pctTxt(st[i].p)}</b>${bar(st[i].p)}` : '<b class="muted">-</b>'}</div>`).join('')}</div></div>
  <div class="row">
    <div class="card"><h2>이번 주 루틴 <small>체크한 날 / 해야 할 날</small></h2>${rrows || '<p class="muted">루틴이 없습니다.</p>'}</div>
    <div class="card"><h2>돌아보기 <small>적는 즉시 저장</small></h2><div class="mbody" style="padding:0">
      ${field('good', '잘한 점', '이번 주에 잘한 것, 지킨 것')}${field('bad', '아쉬운 점', '못 지킨 것과 이유')}${field('next', '다음 주 집중할 것', '다음 주에 꼭 할 1~3가지')}</div></div>
  </div>`;
};

/* ====================== 화면: 설정 ====================== */
VIEWS.set = () => {
  const ar = areas().map((a, i) => `<div class="arow"><input data-area="${i}" data-k="icon" value="${esc(a.icon)}" maxlength="4" style="width:56px;text-align:center"><input data-area="${i}" data-k="name" value="${esc(a.name)}"><button class="sm" data-act="areaUp" data-i="${i}" ${i ? '' : 'disabled'}>↑</button><button class="sm ghost" data-act="areaDel" data-i="${i}">삭제</button></div>`).join('');
  const lc = ledger ? (ledger.tx || []).filter(t => !t.del).length : 0;
  return `<div class="row">
    <div class="card"><h2>영역</h2>${ar}<div class="addline" style="margin-top:8px"><input id="newAreaIcon" placeholder="🙂" maxlength="4" style="width:56px;text-align:center"><input id="newAreaName" placeholder="새 영역 이름"><button data-act="areaAdd">추가</button></div>
      <p class="help">영역은 목표와 루틴을 묶는 큰 분류입니다. 이름·아이콘을 바로 고칠 수 있습니다.</p></div>
    <div class="card"><h2>데이터 파일 · 동기화</h2>
      <p class="help">${connected ? (store.kind === 'ms' ? `연결됨: Microsoft 계정${msAccount ? ` (${esc(msAccount.username || '')})` : ''} · OneDrive <b>${esc(dataPath())}</b>` : `연결됨: <b>${esc(store.name)}</b> (이 PC의 OneDrive 폴더 파일)`) : '데이터 파일이 연결되지 않았습니다.'}</p>
      ${fsOK && msOK() ? `<div class="toolbar"><span class="hint">연결 방식</span><button class="${storeMode() === 'file' ? 'primary' : ''}" data-act="useMode" data-mode="file">이 PC의 파일</button><button class="${storeMode() === 'ms' ? 'primary' : ''}" data-act="useMode" data-mode="ms">Microsoft 계정(OneDrive)</button></div>` : ''}
      <div class="toolbar">${storeMode() === 'file' ? `<button class="primary" data-act="connect">${connected ? '다시 연결' : '데이터 파일 연결'}</button><button data-act="createFile">새 데이터 파일 만들기</button>` : ''}${storeMode() === 'ms' ? `<button class="primary" data-act="connect">${connected ? '다시 연결' : 'Microsoft 계정으로 로그인'}</button>${msAccount ? '<button data-act="msLogout">로그아웃</button>' : ''}` : ''}</div>
      <div class="toolbar"><button data-act="backup">백업 파일 내려받기</button><button data-act="importMerge">백업·충돌 사본 합치기</button><input type="file" id="importFile" accept=".json,application/json" hidden></div></div>
    <div class="card"><h2>가계부 연결 <small>읽기만 함</small></h2>
      <p class="help">${ledger ? `불러옴: ${esc(ledgerSrc)} · 지출 ${lc.toLocaleString()}건` : '아직 가계부 데이터를 불러오지 못했습니다.'}<br>「가계부 정리」 같은 루틴에 <b>가계부 자동</b>을 켜면 그날 가계부에 지출을 입력했을 때 자동으로 체크됩니다. 숫자 목표는 가계부의 저축·투자, 순자산, 총부채 등을 현재값으로 쓸 수 있습니다.</p>
      ${storeMode() === 'ms' ? `<div class="toolbar"><span class="hint">가계부 파일 위치</span><input id="ledgerPath" value="${esc(lsGet(K_LPATH) || LEDGER_DEFAULT)}" style="flex:1;min-width:180px"><button data-act="saveLedgerPath">바꾸기</button></div>` : '<p class="help">PC에서는 이 PC에서 마지막으로 연 가계부 내용을 씁니다.</p>'}
      <button data-act="ledgerReload">다시 불러오기</button></div>
    <div class="card"><h2>업무관리 연결 <small>읽기만 함</small></h2>
      <p class="help">${work ? `불러옴: ${esc(workSrc)} · 사건 ${(work.cases || []).length}건 · 미결 ${workMetric('wOpen')}건${(work.meta || {}).savedAtIso ? ` · 업무관리 마지막 저장 ${esc(String(work.meta.savedAtIso).slice(0, 16).replace('T', ' '))}` : ''}` : '아직 업무관리 데이터를 불러오지 못했습니다.'}<br>숫자 목표에서 올해 수임액·입금액·수임 건수·미결 사건 수 등을 현재값으로 쓸 수 있습니다.</p>
      ${storeMode() === 'ms' ? `<div class="toolbar"><span class="hint">업무관리 파일 위치</span><input id="workPath" value="${esc(lsGet(K_WPATH) || WORK_DEFAULT)}" style="flex:1;min-width:180px"><button data-act="saveWorkPath">바꾸기</button></div>` : '<p class="help">PC에서는 이 PC에서 마지막으로 연 업무관리 내용을 씁니다.</p>'}
      <button data-act="workReload">다시 불러오기</button> <a class="link" href="${esc(workUrl(''))}" target="_blank" rel="noopener">업무관리 열기 →</a></div>
  </div>`;
};

/* ====================== 모달 ====================== */
function openModal({ title, body, submit = '저장', onSubmit, onDelete, onMount }) {
  const d = $('#dlg');
  d.innerHTML = `<form class="modal" novalidate><h3>${esc(title)}</h3><div class="mbody">${body}</div><div class="mfoot">${onDelete ? '<button type="button" class="danger" data-m="del">삭제</button>' : ''}<span class="spacer"></span><button type="button" data-m="cancel">취소</button><button type="submit" class="primary">${esc(submit)}</button></div></form>`;
  const f = d.querySelector('form');
  f.onsubmit = e => { e.preventDefault(); if (onSubmit(f) !== false) d.close(); };
  f.querySelector('[data-m=cancel]').onclick = () => d.close();
  if (onDelete) f.querySelector('[data-m=del]').onclick = () => { if (confirm('삭제할까요?')) { onDelete(); d.close(); } };
  onMount?.(f); d.showModal();
}
$('#dlg').addEventListener('close', () => { if (pendingRender) { pendingRender = false; render(); } });

/* ====================== 이벤트 ====================== */
function findR(id) { return doc.routines.find(r => r.id === id); }
function toggleCheck(r, d) { const was = isDone(r, d); put('checks', { id: `c-${d}-${r.id}`, date: d, rid: r.id, done: was ? 0 : 1 }); commit(); }
const ACT = {
  go: b => { ui.tab = b.dataset.tab; lsSet(K_TAB, ui.tab); renderTabs(); render(); window.scrollTo(0, 0); },
  connect: () => connect(), pickOther: async () => { stored = null; await connect(); }, createFile: () => createFile(), createMs: () => createOnMs(),
  dayMove: b => { ui.date = addDays(ui.date, +b.dataset.n); render(); }, dayToday: () => { ui.date = today(); render(); },
  rtToggle: b => { const r = findR(b.dataset.id); if (r) toggleCheck(r, ui.date); },
  cellToggle: b => { const r = findR(b.dataset.id); if (r) toggleCheck(r, b.dataset.d); },
  weekMove: b => { ui.week = addDays(ui.week, +b.dataset.n); render(); }, weekNow: () => { ui.week = weekStart(today()); render(); },
  rtAdd: () => editRoutine(null), rtEdit: b => editRoutine(b.dataset.id),
  todoToggle: b => { const t = doc.todos.find(x => x.id === b.dataset.id); if (t) { put('todos', Object.assign({}, t, t.done ? { done: 0, doneDate: '' } : { done: 1, doneDate: today() })); commit(); } },
  todoDel: b => { const t = doc.todos.find(x => x.id === b.dataset.id); if (t && confirm(`「${t.title}」을(를) 삭제할까요?`)) { remove('todos', t.id); commit(); } },
  goalAdd: b => editGoal(null, { area: b.dataset.area, level: b.dataset.level, parent: b.dataset.parent }), goalEdit: b => editGoal(b.dataset.id),
  areaUp: b => { const i = +b.dataset.i; if (!i) return; setMeta(m => { m.areas = m.areas && m.areas.length ? m.areas : DEFAULT_AREAS.slice(); [m.areas[i - 1], m.areas[i]] = [m.areas[i], m.areas[i - 1]]; }); commit(); },
  areaDel: b => { const i = +b.dataset.i, a = areas()[i], n = live('goals').filter(g => g.area === a.id).length + live('routines').filter(r => r.area === a.id).length; if (!confirm(n ? `「${a.name}」에 목표·루틴 ${n}개가 있습니다. 영역만 지우고 목표·루틴은 「기타」로 남길까요?` : `「${a.name}」 영역을 삭제할까요?`)) return; setMeta(m => { m.areas = (m.areas && m.areas.length ? m.areas : DEFAULT_AREAS.slice()).filter((_, k) => k !== i); }); commit(); },
  areaAdd: () => { const nm = $('#newAreaName').value.trim(); if (!nm) return; setMeta(m => { m.areas = (m.areas && m.areas.length ? m.areas : DEFAULT_AREAS.slice()); m.areas.push({ id: uid(), name: nm, icon: $('#newAreaIcon').value.trim() || '📌' }); }); commit(); },
  useMode: b => { const m = b.dataset.mode; if (m === storeMode()) return; lsSet(K_MODE, m); store = null; connected = false; lastErr = ''; renderBanner(); setStatus(); render(); connect(); },
  msLogout: () => { if (confirm('Microsoft 계정에서 로그아웃할까요? (가계부도 함께 로그아웃됩니다)')) msLogout(); },
  saveLedgerPath: () => { const v = $('#ledgerPath').value.trim(); if (!v) return; lsSet(K_LPATH, v.startsWith('/') ? v : '/' + v); ACT.ledgerReload(); },
  saveWorkPath: () => { const v = $('#workPath').value.trim(); if (!v) return; lsSet(K_WPATH, v.startsWith('/') ? v : '/' + v); ACT.workReload(); },
  workReload: async () => { await loadWork(true); render(); toast(work ? '업무관리 데이터를 다시 불러왔습니다' : '업무관리 데이터를 찾지 못했습니다'); },
  ledgerReload: async () => { await loadLedger(true); render(); toast(ledger ? '가계부 데이터를 다시 불러왔습니다' : '가계부 데이터를 찾지 못했습니다'); },
  backup: () => download(`목표관리_백업_${today()}.json`, JSON.stringify(doc), 'application/json'),
  importMerge: () => $('#importFile').click(),
};
const main = $('#main');
main.addEventListener('click', e => { const b = e.target.closest('[data-act]'); if (b && ACT[b.dataset.act]) { e.preventDefault(); ACT[b.dataset.act](b, e); } });
$('#banner').addEventListener('click', e => { const b = e.target.closest('[data-act]'); if (b && ACT[b.dataset.act]) ACT[b.dataset.act](b, e); });
main.addEventListener('submit', e => {
  const f = e.target; if (f.dataset.form !== 'todo') return; e.preventDefault();
  const title = f.title.value.trim(); if (!title) return;
  const date = /^\d{4}-\d{2}-\d{2}$/.test(f.date.value) ? f.date.value : ui.date;
  put('todos', { id: uid(), date, title, done: 0, doneDate: '' }); commit(false); render();
  if (date !== ui.date) toast(`${mlabel(date)} To-do로 추가했습니다`);
  const inp = $('#main [data-keep="todoInput"]'); if (inp) inp.focus();
});
let jT = null;
main.addEventListener('input', e => {
  const el = e.target;
  if (el.dataset.review) { clearTimeout(jT); jT = setTimeout(() => saveText(el), 800); }
});
function saveText(el) {
  if (el.dataset.review) { const id = 'w-' + ui.week, old = doc.reviews.find(x => x.id === id && !x.del) || { id, week: ui.week }; if ((old[el.dataset.review] || '') === el.value) return; put('reviews', Object.assign({}, old, { [el.dataset.review]: el.value })); commit(false); }
}
main.addEventListener('change', e => {
  const el = e.target;
  if (el.dataset.review) { clearTimeout(jT); saveText(el); return; }
  if (el.dataset.g) { ui[el.dataset.g] = +el.value; render(); return; }
  if (el.dataset.area != null) { const i = +el.dataset.area, k = el.dataset.k; setMeta(m => { m.areas = (m.areas && m.areas.length ? m.areas : DEFAULT_AREAS.slice()).map(a => ({ ...a })); m.areas[i][k] = el.value.trim(); }); commit(); return; }
  if (el.id === 'importFile' && el.files[0]) {
    el.files[0].text().then(t => { let r; try { r = JSON.parse(t); } catch (x) { toast('JSON 파일이 아닙니다'); return; } if (r.app !== APP) { toast('목표관리 데이터 파일이 아닙니다'); return; } doc = merge(doc, normalize(r)); commit(); toast('합쳤습니다'); el.value = ''; });
  }
});

/* ====================== 시작 ====================== */
(async function init() {
  renderTabs(); render(); renderBanner(); setStatus();
  const m = storeMode();
  if (m === 'ms') {
    try { await msInit(); if (msAccount) { store = msStore(); await openStore(); } }
    catch (e) { lastErr = e.message; }
  } else if (m === 'file') {
    stored = await idbGet('file');
    if (stored) { try { if (await stored.queryPermission({ mode: 'readwrite' }) === 'granted') { fh = stored; store = fileStore(fh); await openStore(); } } catch (e) { lastErr = ''; } }
  }
  renderBanner(); setStatus();
  const l1 = await loadLedger(true), w1 = await loadWork(true); if (l1 || w1) safeRender(); else render();
  setInterval(async () => { if (document.hidden) return; const a = await loadLedger(), b = await loadWork(); if (a || b) safeRender(); }, 60000);
  // 날짜가 바뀌면(자정이 지나면) 오늘 화면을 새 날짜로
  let lastDay = today();
  setInterval(() => { const t = today(); if (t !== lastDay) { if (ui.date === lastDay) ui.date = t; ui.week = weekStart(t); lastDay = t; safeRender(); } }, 60000);
})();
window.__mokpyo = { load: d => { doc = normalize(d); render(); }, setWork: d => { work = d; workAt = Date.now(); workSrc = "test"; render(); }, get doc() { return doc; }, setLedger: d => { ledger = d; ledgerAt = Date.now(); ledgerSrc = 'test'; LDAYS = new Set(); for (const t of d.tx || []) if (!t.del && t.upd > 1e12) LDAYS.add(ds(new Date(t.upd))); render(); } };
</script>
